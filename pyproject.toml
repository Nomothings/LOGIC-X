[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-x"
version = "1.0.0"
description = "LOGIC-X: tool-integrated symbolic reasoning with T-MCTS and the LogicEval-X benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "httpx>=0.27",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["tmcts*"]
